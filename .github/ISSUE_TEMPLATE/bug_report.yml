name: Bug report
description: Something in the app does not work, or the exported images come out wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If the problem is with **exported pixels** (a clipped
        headline, a wrong bezel, a font that fell back), attaching the exported PNG
        is worth more than any description.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what the app did instead of what you expected.
      placeholder: I picked the Panorama layout with two screenshots and the export wrote one tile instead of two.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the app's footer.
      placeholder: 1.1.0
    validations:
      required: true
  - type: dropdown
    id: how-run
    attributes:
      label: How are you running it
      options:
        - pnpm dev (browser)
        - forge dev (installed package)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.3, M2
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or exported files
      description: Drag them in. Anything from the devtools console helps too.
